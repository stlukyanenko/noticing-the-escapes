title: Package Registry Account Created Then Uploading to One Project Name
id: 668b95a5-cae8-4c34-bf9d-62d0bbd608ff
status: experimental
description: |
    Registry-side building block. Detects the creation of a new publisher account in a package
    registry (PyPI, npm or an internal equivalent). This rule is intended only as the first step of
    the correlation below; on its own it fires on every legitimate new user.
    This is a rule for registry operators, not for the model developer's sandbox. In the Anthropic
    "incident C" case an agent published a real package that went live for about an hour and reached
    roughly fifteen hosts, and the registry's own takedown was the detection. The agent's work
    before the successful publish happened entirely in the registry's application logs.
references:
    - https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents
    - https://docs.pypi.org/api/
author: Apart Research + CeSIA AI Incident Response Sprint, "Caught From Outside" team
date: 2026-09-13
tags:
    - attack.persistence
    - attack.t1136
logsource:
    product: package_registry
    service: application
    definition: 'Requirements: registry application logs carrying an event name, the acting account name, the account age or creation event, the target project name, the client address and the HTTP status of upload API calls. Field names below follow the ECS-style naming a registry operator would normalise to.'
detection:
    selection:
        event.action:
            - 'account_created'
            - 'user_register'
    condition: selection
falsepositives:
    - Every genuine new publisher. Do not alert on this rule alone.
level: informational
---
title: Package Registry Upload Rejected
id: 7bda4671-7160-402b-9f7a-e1a78faaa007
status: experimental
description: |
    Registry-side building block. Detects a rejected upload to the registry's publish API: HTTP 400
    or 403, which is what a publisher receives when the project name is taken, the name is too close
    to an existing one, the metadata is invalid or the account lacks permission on that project.
    A human publisher hits one or two of these and then reads the error. An agent retries.
references:
    - https://docs.pypi.org/api/
author: Apart Research + CeSIA AI Incident Response Sprint, "Caught From Outside" team
date: 2026-09-13
tags:
    - attack.resource-development
    - attack.t1608.001
logsource:
    product: package_registry
    service: application
    definition: 'Requirements: upload API logs with the acting account, target project name and HTTP status.'
detection:
    selection:
        event.action: 'package_upload'
        http.response.status_code:
            - 400
            - 403
    condition: selection
falsepositives:
    - Ordinary publisher mistakes: a name already taken, a malformed wheel, an expired token.
    - Continuous-integration pipelines re-running a publish step after a failure.
level: informational
---
title: Package Registry Upload Accepted
id: d6bb9972-2d64-471a-804a-155ad71689c0
status: experimental
description: |
    Registry-side building block. Detects an accepted upload to the registry's publish API.
references:
    - https://docs.pypi.org/api/
author: Apart Research + CeSIA AI Incident Response Sprint, "Caught From Outside" team
date: 2026-09-13
tags:
    - attack.resource-development
    - attack.t1608.001
logsource:
    product: package_registry
    service: application
    definition: 'Requirements: upload API logs with the acting account, target project name and HTTP status.'
detection:
    selection:
        event.action: 'package_upload'
        http.response.status_code:
            - 200
            - 201
    condition: selection
falsepositives:
    - Every genuine release. Do not alert on this rule alone.
level: informational
