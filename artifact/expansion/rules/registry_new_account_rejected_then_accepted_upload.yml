title: New Package Registry Account Retrying a Name Until an Upload Succeeds
id: c2e54b18-08e5-4e0e-a068-1226871182a2
status: experimental
description: |
    Detects the sequence a newly created publisher account creating itself, then being rejected
    repeatedly on uploads for the same project name, then succeeding, all within one day and from
    one account. That ordering is the machine-readable shape of "an automated publisher probing
    until the registry lets it through", and it separates an agent from a human publisher, who
    usually reads the first rejection and changes the name or the metadata rather than retrying.
    Window rationale. One day is chosen because the human version of this sequence spans days
    (a person files a name dispute, or comes back after reading the docs), while the agent version
    in the public record ran in minutes to hours: the package in the Anthropic case was live for
    about an hour before the registry removed it. Registries with heavy CI traffic can tighten the
    window to one hour without losing the pattern.
    Deliberately generic. No package name, typosquat target or hostname appears in this rule, and
    none is needed: the signal is the ordering of registry events, not any particular name.
references:
    - https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents
    - https://docs.pypi.org/api/
author: Apart Research + CeSIA AI Incident Response Sprint, "Caught From Outside" team
date: 2026-09-13
correlation:
    type: temporal_ordered
    rules:
        - 668b95a5-cae8-4c34-bf9d-62d0bbd608ff
        - 7bda4671-7160-402b-9f7a-e1a78faaa007
        - d6bb9972-2d64-471a-804a-155ad71689c0
    group-by:
        - user.name
    timespan: 1d
    aliases:
        user.name:
            668b95a5-cae8-4c34-bf9d-62d0bbd608ff: user.name
            7bda4671-7160-402b-9f7a-e1a78faaa007: user.name
            d6bb9972-2d64-471a-804a-155ad71689c0: user.name
falsepositives:
    - A first-time publisher whose first release is rejected for a name clash or bad metadata and who fixes it the same day. Requiring three or more rejections, or grouping by project name as well as account, reduces this.
    - Automated release pipelines set up by a brand-new account, for example a project migrating to a new organisation.
    - Registries that return 403 for rate limiting rather than for permissions will produce extra matches; confirm the status-code meaning in the registry's own API before deploying.
level: medium
